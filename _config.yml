# About Section
about_title: About myself
about_profile_image: images/me.jpeg
about_content: | # this will include new lines to allow paragraphs
  I'm a machine learning engineer based in Zurich, Switzerland, with roots in particle physics and cosmology.

  I received my PhD from the University of Heidelberg and the Max Planck Institute for Nuclear Physics, where I worked on neutrino physics, modified gravity, and gravitational wave signals from phase transitions in the early Universe. I was interested in the traces new physics would leave in experimental data: how to extract them from the background, or in the absence of a signal, how to put limits on new particles and their interactions.

  I then moved to Zurich to work at the Institute for Biomedical Engineering of the University and ETH Zurich, where I used image-to-image translation to synthetically augment training data for stroke lesion segmentation in MR and CT images. I also supervised Master's theses, co-supervised a PhD student, and reviewed for scientific journals. My time in academia was rewarding: I learned a lot and met many great people. But I wanted to work on real-world problems and see the impact of my work more directly.

  This brought me to [Acodis](https://www.acodis.io), a startup in Winterthur, where I worked on document understanding and the full ML lifecycle, from proofs of concept for customer projects and model pre-training to production-ready ML models. I trained a fine-tunable table extraction model that became one of the top-selling product features.

  More recently, I joined [Kaiko.ai](https://kaiko.ai), an Amsterdam- and Zurich-based startup in the healthcare space, where I lead the mid-training team. We do continual pre-training of large vision-language mixture-of-experts models on web-scale image and text data, including histopathology whole-slide images, radiology scans, and their associated reports. We also post-train our models for specific clinical tasks. I wrote a [blog post](https://kaiko.ai/insights-hub/Training-clinical-reasoning-model-at-scale) about our work on training a clinical reasoning model at scale, with more to come.

  Outside work, you'll usually find me rowing on Lake Zurich early in the morning, as a member of [Ruderclub Zürich](https://www.rcz.ch) and the [Zurich Penguins](https://www.zurichpenguins.ch). Rowing has inspired the [Row Pacer](https://row-pacer.app), an open-source app I built to track rowing metrics on the water. I've come to enjoy the peacefulness of the lake and the challenge of improving my technique. In a similar vein, but off the water, I also restore vintage mechanical watches, tinker with my espresso machine, and play electric and acoustic guitar. 

content:
  - title: Latest posts
    layout: posts

  - title: Research
    layout: list
    content:
      - layout: left
        title: Neutrino Physics
        description: | # this will include new lines to allow paragraphs
          Why neutrinos have mass is one of the open questions of particle physics. In my Master's thesis and during my PhD, I studied radiative neutrino mass models, in which neutrino masses arise from quantum corrections, and tested them with renormalization group methods and cosmological and astrophysical data.

          - [Parity problem of the scotogenic neutrino model](https://journals.aps.org/prd/abstract/10.1103/PhysRevD.92.095002), <i>Physical Review D</i> (2015)

      - layout: left
        title: Cosmology
        description: | # this will include new lines to allow paragraphs
          Dark matter and dark energy make up most of the Universe, but we don't know what they are. As a postdoc at the MPI for Nuclear Physics, I led a project testing alternative cosmologies and modified gravity theories on a novel combination of astrophysical data sets, using <mark>Monte Carlo</mark> methods, which gave new constraints on these scenarios. The code is open source (see <i>Cosmological Tests</i> under Projects).

          - [Probing alternative cosmologies through the inverse distance ladder](https://iopscience.iop.org/article/10.1088/1475-7516/2020/10/040), <i>Journal of Cosmology and Astroparticle Physics</i> (2020)

      - layout: left
        title: Gravitational Waves
        description: | # this will include new lines to allow paragraphs
          The first detection of gravitational waves in 2015 opened an entirely new way to test physics beyond the Standard Model. I studied the gravitational-wave signal from first-order phase transitions in the early Universe. Because the fluid dynamics simulations involved are expensive, I trained a <mark>recommender system</mark> to suggest the most promising regions of parameter space to simulate. With my collaborators, I also showed that in theories with a massive graviton, gravitational waves can oscillate, much like neutrinos, which would leave unique signatures in the signal.

          - [A fresh look at the gravitational-wave signal from cosmological phase transitions](https://link.springer.com/article/10.1007/JHEP03(2020)004), <i>Journal of High Energy Physics</i> (2020)
          - [Gravitational Wave Oscillations in Bigravity](https://journals.aps.org/prl/abstract/10.1103/PhysRevLett.119.111101), <i>Physical Review Letters</i> (2017)

      - layout: left
        title: Medical Imaging
        description: | # this will include new lines to allow paragraphs
          At the Institute for Biomedical Engineering of the University and ETH Zurich, I used image-to-image translation to generate synthetic MR and CT images for training stroke lesion segmentation models, reaching state-of-the-art results with a fraction of the labeled training data.

          - [Image translation for medical image generation: Ischemic stroke lesion segmentation](https://www.sciencedirect.com/science/article/pii/S1746809421008806), <i>Biomedical Signal Processing and Control</i> (2022)

      - layout: left
        title: Publications
        description: | # this will include new lines to allow paragraphs
          15 peer-reviewed articles; the complete list is on [Google Scholar](https://scholar.google.com/citations?user=aG6ipTcAAAAJ&hl=en).

