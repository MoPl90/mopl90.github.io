        description: | # this will include new lines to allow paragraphs
          A web app that tracks rowing metrics in real time from the phone's motion sensor and GPS, built with <mark>React</mark> and <mark>Vite</mark> for use on the water.

      - layout: top-middle
        title: Homelab [2023 – now]
        description: | # this will include new lines to allow paragraphs
          My Raspberry Pi runs a <mark>Docker</mark> stack of useful self-hosted services, like document storage and network backups, as well as [Hermes Agent](https://hermes-agent.nousresearch.com), the AI agent by Nous Research, running open-weight models via [OpenRouter](https://openrouter.ai).

      - layout: top-middle
        title: Watches [2026]
        description: | # this will include new lines to allow paragraphs
          I repair and restore vintage Japanese mechanical watches. Learning about the engineering history of watches and the mechanics behind them has been a fascinating journey. Tracking down spare parts, polishing the crystal, and putting it all together into a functional timepiece is a strangely satisfying and meditative process. I want to write up what I learn along the way. It's a fun hobby that combines engineering, history, and craftsmanship.

